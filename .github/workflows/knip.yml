name: Knip

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-knip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache deps
        run: deno task cache

      - name: Run knip via Deno
        run: deno task knip:ci
