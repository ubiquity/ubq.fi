name: Knip

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-knip:
    runs-on: ubuntu-latest
    # Disabled: knip currently requires a package.json, which was removed
    # as part of the Deno migration. Re-enable when knip supports
    # package-less analysis or if we decide to restore a minimal package.json.
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache deps
        run: deno task cache

      - name: Run knip via Deno
        run: deno task knip:ci
