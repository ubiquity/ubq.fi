name: Deploy to Deno Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install deps and build static
        run: |
          yarn install --frozen-lockfile || yarn install
          yarn build

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "ubq-fi"
          entrypoint: "serve.ts"
