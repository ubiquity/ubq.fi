name: Deploy to Deno Deploy

on:
  push:
    branches:
      - main
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache deps
        run: deno task cache

      - name: Build static assets
        run: deno task build

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "ubq-fi"
          entrypoint: "serve.ts"
