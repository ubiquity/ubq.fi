name: Spell Check

on:
  push:
  pull_request:

jobs:
  spellcheck:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run cspell via Deno
        run: deno task cspell
